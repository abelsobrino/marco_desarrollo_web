<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1" name="viewport">
  <title>ChambaCerca | Trabajo y servicios locales</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/componentes.css">
  <link rel="stylesheet" href="css/acceso.css">
  <link rel="stylesheet" href="css/trabajos.css">
  <link rel="stylesheet" href="css/mensajes.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="css/transiciones.css">
</head>
<body>
  <header>
<a class="brand" href="index.html">Chamba<span>Cerca</span></a>
<nav>
<button class="private" data-view="eleccion" hidden="">
        Cambiar de modo</button><button class="private" data-view="panel" hidden="">
        Mi actividad</button><button class="private" data-view="perfil" hidden="">Mi perfil</button><button class="primary" data-view="acceso" id="entrar">
        Iniciar sesión</button><button hidden="" id="salir">Salir</button><button aria-label="Mensajes" class="message-button private" data-view="bandeja" hidden="" id="btnMensajes" title="Mensajes">
<svg aria-hidden="true" fill="none" height="24" stroke="currentColor" stroke-width="1.8" viewbox="0 0 24 24" width="24">
<path d="M21 11.5a8.5 8.5 0 0 1-8.5 8.5H4l-3 2 2-6.5A8.5 8.5 0 1 1 21 11.5Z"></path>
<path d="M7 9h9M7 13h6"></path>
</svg><span class="unread-badge" hidden="" id="badgeMensajes"></span>
</button>
</nav>
</header>
  <main>
    <div aria-live="polite" hidden id="notice" role="status"></div>
    <div id="vistasRoot">
      <div class="app-loader" id="appLoader">
        <div class="spinner-border text-primary" role="status" aria-hidden="true"></div>
        <span>Cargando ChambaCerca…</span>
      </div>
    </div>
  </main>
  <footer>ChambaCerca · Servicios locales, oportunidades reales.</footer>
  <dialog id="formDialog">
<form id="accionForm">
<h2 id="accionTitulo"></h2>
<div id="accionCampos"></div>
<div class="tabs">
<button class="primary">Confirmar</button><button id="cerrarDialog" type="button">Cancelar</button>
</div>
<p id="dialogError" role="alert"></p>
</form>
</dialog>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.js"></script>
  <script src="js/config.js"></script>
  <script src="js/cargar-vistas.js"></script>
</body>
</html>
