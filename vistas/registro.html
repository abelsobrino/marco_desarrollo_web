<section class="view auth-view" hidden="" id="registroVista">
<article class="auth-card">
<h1>Crea tu cuenta</h1>
<p>Una sola cuenta. Tú eliges si quieres contratar o trabajar.</p>
<form id="registro">
<label>Nombre<input autocomplete="name" maxlength="100" minlength="2" name="nombre" required=""/></label><label>Correo<input autocomplete="email" name="email" placeholder="alumno01@example.com" required="" type="email"/></label><label>Contraseña<input autocomplete="new-password" minlength="8" name="password" required="" type="password"/></label><small>Mínimo 8 caracteres.</small><button class="primary">Registrarme</button>
</form>
<p class="auth-link">
          ¿Ya tienes una cuenta?
          <button class="text-button" data-view="acceso">
            Inicia sesión
          </button>
</p>
<p id="registroEstado" role="status"></p>
</article>
</section>
